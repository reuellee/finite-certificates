name: injectivity diagnostics and parent pilot

on:
  pull_request:
    paths:
      - 'ops/research-team/experiments/2026-09-09-injectivity-cuda/**'
      - '.github/workflows/injectivity-pilot.yml'
  push:
    branches: ['research/injectivity-cuda-20260909']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    name: independent injectivity and parent certificate replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU replay dependencies
        run: python -m pip install numpy scipy
      - name: Check frozen evidence and independent certificates
        working-directory: ops/research-team/experiments/2026-09-09-injectivity-cuda
        run: python -B replay_checkpoint.py
