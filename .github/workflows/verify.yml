name: verify

# `pull_request` (not `pull_request_target`): forked pull requests run without
# secrets and with a read-only token. Never execute fork code with write access.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly exhaustive replay (Mondays 04:00 UTC).
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: deterministic verification plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      exhaustive: ${{ steps.plan.outputs.exhaustive }}
      proof_change: ${{ steps.plan.outputs.proof_change }}
      slow_changed: ${{ steps.plan.outputs.slow_changed }}
      external_changed: ${{ steps.plan.outputs.external_changed }}
      maxout: ${{ steps.plan.outputs.maxout }}
      diag2_atlas: ${{ steps.plan.outputs.diag2_atlas }}
      labeled_pairs: ${{ steps.plan.outputs.labeled_pairs }}
      source_block_labels: ${{ steps.plan.outputs.source_block_labels }}
      parent860: ${{ steps.plan.outputs.parent860 }}
      changed_count: ${{ steps.plan.outputs.changed_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        name: Classify changed proof surfaces
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python ops/ci/classify_changes.py
          --event "$CI_EVENT"
          --base "$CI_BASE_SHA"
          --head "$CI_HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
          --github-summary "$GITHUB_STEP_SUMMARY"

  quick-gate:
    # Keep this job and the final `suite` job stable for branch protection.
    name: verifier suite shard coverage audit
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository proof-surface navigation
        run: python verify_repository_structure.py
      - name: Exercise CI routing canaries
        run: python ops/ci/check_ci_policy.py
      - name: Prove exhaustive shard union and disjointness
        run: python ai/omreal/verify_run_all_ci_shards.py

  fast-suite:
    name: changed proof surface (fast verifier suite)
    needs: [plan, quick-gate]
    if: needs.plan.outputs.proof_change == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install verifier dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the bounded exact verifier suite
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python -u run_all.py
          --fast --ci-delegated
      - name: Report regenerated-artifact drift
        if: always()
        continue-on-error: true
        run: git diff --stat -- . ':!*.log'

  changed-slow-verifiers:
    name: directly changed slow verifiers
    needs: [plan, quick-gate]
    if: needs.plan.outputs.slow_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install verifier dependencies
        run: python -m pip install -r requirements.txt
      - name: Replay changed slow verifiers and direct dependants
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python -u
          ops/ci/run_changed_slow_verifiers.py
          --base "$CI_BASE_SHA" --head "$CI_HEAD_SHA"

  external-input-verifier-policy:
    name: external-input verifier replay policy
    needs: [plan, quick-gate]
    if: needs.plan.outputs.external_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require a replayable pinned input before verifier changes
        run: python ops/ci/reject_external_verifier_change.py

  maxout-capstone:
    name: maxout (3,5) capstone checks
    needs: [plan, quick-gate]
    if: needs.plan.outputs.full == 'true' || needs.plan.outputs.maxout == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install verifier dependencies
        run: python -m pip install -r requirements.txt
      - name: OM(3,5) chirotope orbit
        working-directory: ai/maxout
        run: python check_om35_uniqueness.py
      - name: Split-orbit accounting
        working-directory: ai/maxout/capstone
        run: python check_split_orbits.py
      - name: Independently audit all 132,560 certificates
        working-directory: ai/maxout/capstone
        run: >-
          python independent_audit.py
          --report "$RUNNER_TEMP/independent_audit_report.json"
          --progress "$RUNNER_TEMP/independent_audit_progress.json"
      - name: Check certificate transport
        working-directory: ai/maxout/capstone
        run: python check_transport.py --n-group 12 --n-certs 8 --seed 11
      - name: Run the stage 2c-2 exact checker
        working-directory: ai/maxout/stage2c2_gpt
        run: python check_stage2c2.py

  nine-dvl-diag2-atlas:
    name: 9DVL diagonal-two 178-chart escape audit
    needs: [plan, quick-gate]
    if: >-
      needs.plan.outputs.full == 'true' ||
      needs.plan.outputs.exhaustive == 'true' ||
      needs.plan.outputs.diag2_atlas == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Rebuild all 12,657,936 exact escape masks
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/verify_diag2_escape_set_atlas178.py --workers 8
      - name: Rebuild the ordered two-root carrier graphs
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/verify_diag3_ordered_root_atlas178.py --workers 4

  nine-dvl-labeled-pairs:
    name: 9DVL relative-label pair audit
    needs: [plan, quick-gate]
    if: >-
      needs.plan.outputs.full == 'true' ||
      needs.plan.outputs.exhaustive == 'true' ||
      needs.plan.outputs.labeled_pairs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Rebuild all 9,476 residual-factor pair orbits and certificates
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/DIAG2_PIVOT_LABELED_PAIR_ORBITS_VERIFY.py --all-frames
      - name: Saturate the seven type-(49,49) pair residues
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/verify_diag2_pivot_49_pair_saturation.py
      - name: Close all 122 pair residues by affine fibers
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/verify_diag2_pivot_all_pair_fibers.py

  nine-dvl-source-block-labels:
    name: 9DVL source block-label continuation audit
    needs: [plan, quick-gate]
    if: >-
      needs.plan.outputs.full == 'true' ||
      needs.plan.outputs.exhaustive == 'true' ||
      needs.plan.outputs.source_block_labels == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install numpy scipy
      - name: Replay all 5,615 labelled source-bridge chambers
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/verify_diag3_pair_parent_source_block_labels.py

  nine-dvl-parent860-pilot:
    name: 9DVL parent-860 CEGIS routing pilot
    needs: [plan, quick-gate]
    if: >-
      needs.plan.outputs.full == 'true' ||
      needs.plan.outputs.exhaustive == 'true' ||
      needs.plan.outputs.parent860 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Rebuild the exact 23-chamber coordinate star
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/DIAG9_GRAPH_parent860_star.py
      - name: Replay the 16-chord counterexample-guided repair
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/DIAG9_GRAPH_parent860_star_repair.py

  suite-shards:
    name: exhaustive verifier shard ${{ matrix.shard }}/4
    needs: [plan, quick-gate]
    if: needs.plan.outputs.full == 'true' || needs.plan.outputs.exhaustive == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install verifier dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic exhaustive shard
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python -u run_all.py
          --ci-delegated --shard ${{ matrix.shard }}/4
      - name: Report regenerated-artifact drift
        if: always()
        continue-on-error: true
        run: git diff --stat -- . ':!*.log'

  full-audit:
    # Generator-coupled second opinion; the independent audit above is the
    # primary maxout trust boundary.
    name: secondary certificate audit (manual/scheduled)
    needs: [plan, quick-gate]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install verifier dependencies
        run: python -m pip install -r requirements.txt
      - name: Re-verify every certificate in the library
        working-directory: ai/maxout/stage2c2_gpt
        run: python audit_all_certificates.py

  suite:
    name: verifier suite (complete)
    if: always()
    needs:
      - plan
      - quick-gate
      - fast-suite
      - changed-slow-verifiers
      - external-input-verifier-policy
      - maxout-capstone
      - nine-dvl-diag2-atlas
      - nine-dvl-labeled-pairs
      - nine-dvl-source-block-labels
      - nine-dvl-parent860-pilot
      - suite-shards
      - full-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the planned jobs ran and passed
        env:
          CI_PLAN: ${{ toJSON(needs.plan.outputs) }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python ops/ci/check_gate_results.py
