name: verify

# `pull_request` (not `pull_request_target`): pull requests from forks run with
# a read-only token and no access to secrets. Never change this to
# `pull_request_target` — that would run untrusted code with write access.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly full re-verification of the certificate library (Mondays 04:00 UTC).
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  suite-shard-contract:
    name: verifier suite shard coverage audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove exact shard union and disjointness
        run: python ai/omreal/verify_run_all_ci_shards.py

  suite-shards:
    name: verifier suite shard ${{ matrix.shard }}/4
    needs: suite-shard-contract
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Run deterministic verifier shard
        run: python -u run_all.py --ci-delegated --shard ${{ matrix.shard }}/4
      # Some verifiers regenerate committed artifacts. If regeneration does
      # not reproduce what is committed, that is a signal worth seeing;
      # informational only, since generation need not be byte-stable.
      - name: Report drift in regenerated artifacts
        if: always()
        continue-on-error: true
        run: git diff --stat -- . ':!*.log'

  suite:
    name: verifier suite (complete)
    needs: [suite-shard-contract, suite-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm all deterministic shards passed
        run: echo 'All verifier shards and the exact shard coverage audit passed.'

  nine-dvl-diag2-atlas:
    name: 9DVL diagonal-two 178-chart escape audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Rebuild all 12,657,936 exact escape masks
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/verify_diag2_escape_set_atlas178.py --workers 8
      - name: Rebuild the ordered two-root carrier graphs
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/verify_diag3_ordered_root_atlas178.py --workers 4

  nine-dvl-labeled-pairs:
    name: 9DVL relative-label pair audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Rebuild all 9,476 residual-factor pair orbits and certificates
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/DIAG2_PIVOT_LABELED_PAIR_ORBITS_VERIFY.py --all-frames
      - name: Saturate the seven type-(49,49) pair residues
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/verify_diag2_pivot_49_pair_saturation.py
      - name: Close all 122 pair residues by affine fibers
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/verify_diag2_pivot_all_pair_fibers.py

  nine-dvl-source-block-labels:
    name: 9DVL source block-label continuation audit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Replay all 5,615 labelled source-bridge chambers
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/verify_diag3_pair_parent_source_block_labels.py

  nine-dvl-parent860-pilot:
    name: 9DVL parent-860 CEGIS routing pilot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Rebuild the exact 23-chamber coordinate star
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/DIAG9_GRAPH_parent860_star.py
      - name: Replay the 16-chord counterexample-guided repair
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python
          ai/omreal/DIAG9_GRAPH_parent860_star_repair.py

  maxout-capstone:
    name: maxout (3,5) capstone checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy sympy
      # Attainment (the exact 42-vertex instance) is covered by the `fast`
      # job: run_all.py picks up every verify_*.py, including
      # ai/maxout/verify_c66_new_cases.py. This job runs the upper-bound
      # checks, which are named check_* and so are not in that suite.
      - name: OM(3,5) chirotope orbit (stdlib)
        working-directory: ai/maxout
        run: python check_om35_uniqueness.py
      - name: Split-orbit accounting (stdlib)
        working-directory: ai/maxout/capstone
        run: python check_split_orbits.py
      # The primary upper-bound check: re-proves all 132,560 cell-wide
      # certificates from the serialized artifacts with no import from any
      # generation-side module and no Groebner machinery. Stdlib only, ~2 min,
      # so it is a required job rather than a scheduled one. The report is
      # written outside the worktree so this job never reports drift.
      - name: Independent certificate audit (stdlib, all 132,560)
        working-directory: ai/maxout/capstone
        run: python independent_audit.py --report "$RUNNER_TEMP/independent_audit_report.json" --progress "$RUNNER_TEMP/independent_audit_progress.json"
      - name: Certificate transport
        working-directory: ai/maxout/capstone
        run: python check_transport.py --n-group 12 --n-certs 8 --seed 11
      - name: Stage 2c-2 exact checker
        working-directory: ai/maxout/stage2c2_gpt
        run: python check_stage2c2.py

  # The generator-coupled second opinion. It imports the generators'
  # quotient-ring construction, so it is NOT the independence guarantee --
  # that is the stdlib `independent_audit.py` step in `maxout-capstone`
  # above, which runs on every push and pull request. This job keeps the
  # older auditor running so the two continue to agree.
  full-audit:
    name: secondary certificate audit (~20 min, manual/scheduled)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy sympy
      - name: Re-verify every certificate in the library
        working-directory: ai/maxout/stage2c2_gpt
        run: python audit_all_certificates.py
