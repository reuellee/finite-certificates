claims:
  - claim_id: parent860_local_support_width
    proposed_outcome_class: finite_exact
    exact_mathematical_statement: >-
      The 12 proper support patterns represented on the pinned 24-vertex,
      39-edge parent-860 network have inclusion width exactly six, nine
      size-six antichains with empty common network support, and no local
      size-eight antichain.
    parent_quantifier: one pinned embedded network in parent 860
    family_quantifier: all 12 proper support-pattern classes on that network, excluding the universal class
    coefficient_ring_or_field: exact bitset inclusion
    explicit_nonconsequences: >-
      Local equality or inclusion need not equal global equality or inclusion;
      this is not a parent-local or global diagonal-eight theorem.
  - claim_id: parent860_ad_triangle_filling
    proposed_outcome_class: finite_exact
    exact_mathematical_statement: >-
      The rational a/d triangle on network vertices 0,4,11 stays in parent
      860 and in the common feasibility locus of five displayed proper
      incomparable signatures, and fills their retained graph cycle.
    parent_quantifier: one exact rational triangle in parent 860
    family_quantifier: the five certificate signatures
    coefficient_ring_or_field: Q
    explicit_nonconsequences: >-
      No full parent coverage, relative infinity, or size-eight result.
  - claim_id: parent860_ag_pentagon_filling
    proposed_outcome_class: finite_exact
    exact_mathematical_statement: >-
      On the rational polygon 1-2-3-18-17-1, all parent brackets remain
      strict, exactly residual factors 16573 and 22629 meet the polygon, the
      walls meet transversely once, and the resulting node dual two-cell kills
      the mask-3 graph cycle for every boundary-common stored label.
    parent_quantifier: one exact rational polygon in parent 860
    family_quantifier: the 26038 stored labels common to its boundary chambers
    coefficient_ring_or_field: Q
    explicit_nonconsequences: >-
      The network and polygon do not cover parent 860; no global dominance or
      true-infinity claim is made.
  - claim_id: graph_only_h1_no_go
    proposed_outcome_class: abstract_no_go
    exact_mathematical_statement: >-
      Identical complete labelled zero/one skeleta can have H1 ranks one or
      zero after changing one two-cell, and relative infinity can also change
      H1; complete graph labels therefore do not determine diagonal-eight H1.
    parent_quantifier: abstract finite regular relative two-complex fixtures
    family_quantifier: one exact proper incomparable eight-family per fixture
    coefficient_ring_or_field: F2, with Q also replayed for the graph triangle
    explicit_nonconsequences: >-
      The fixtures are not UOM counterexamples; nonzero mod-two H1 alone is
      not asserted to imply nonzero rational H1.
  - claim_id: unconditional_transport_no_go
    proposed_outcome_class: finite_exact_no_go
    exact_mathematical_statement: >-
      One exact realizable one-bracket mutation changes the complete abstract
      extension universe, and one exact reducible deletion has nontrivial
      label fibers; neither operation alone supplies a labelled stratified-pair
      isomorphism capable of transporting the relative H1 certificate.
    parent_quantifier: the pinned mutation and deletion fixtures only
    family_quantifier: their complete enumerated label universes
    coefficient_ring_or_field: exact signed combinatorics
    explicit_nonconsequences: >-
      No impossibility claim for a separately certified quiet-edge transport
      graph or explicit labelled regular-CW pair isomorphism.

