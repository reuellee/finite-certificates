target:
  claim: >-
    Formulate a precise sufficient finite graph criterion which, from exact
    component-faithful continuation and genuine parent-infinity decorations,
    proves that every represented triple-bad component is noncompact; prove
    it or give a finite countermodel.  Determine separately whether the same
    component graph can certify the pair master complex.
  quantifiers: >-
    Every finite directed graph covering a declared family of connected
    triple-bad components, with vertices carrying stable local-component IDs,
    every edge certified to remain in the same underlying component closure,
    and every true-infinity tag certified in the parent compactification.
    Pair claims are restricted to information determined by that graph and
    its boundary tags.
  ledger_id: diag3_triple_hc0 and diag3_pair_hc1
assumptions:
  - The compactification is Hausdorff and its true parent-infinity subset is closed.
  - Component coverage, stable local-component identity, same-component continuation, and sound true-infinity tags are independently certified rather than inferred from local samples.
  - Artificial scope boundaries are ordinary nodes and never true infinity.
