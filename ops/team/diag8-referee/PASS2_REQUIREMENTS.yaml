delivery_constraints:
  - Provide candidate artifacts read-only; the referee will not repair them.
  - Do not require access to another agent's uncommitted worktree.
  - Keep replay within 35 wall-clock minutes and 4 GiB RAM, or ask the coordinator to narrow the claim before pass two.
  - State explicitly when an item is inapplicable and why; silence is treated as missing evidence.
  - A parent-860 roadmap/network without complete two-cells, coverage, and infinity data is insufficient.

minimum_for_useful_null_handoff:
  - exact searched or constructed scope
  - complete surviving defects
  - all generated artifact digests
  - deterministic partial replay command
  - next discriminating datum
