summary: >-
  Proved a sufficient labeled stratified-pair transport theorem, then exactly
  disproved the inference that mutation connectivity or reducible deletion
  supplies it. A one-bracket rational UOM(4,8) mutation changes the complete
  abstract extension count from 73,712 to 74,342. A reducible lexicographic
  deletion maps 25,856 full labels onto 5,294 deletion labels with 4,964
  nontrivial fibers and maximum fiber 282. Finite exact fixtures separately
  show that changing true infinity or codimension-two incidence changes H1.
