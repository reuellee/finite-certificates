coverage:
  included: >-
    One nonzero primitive full-support residual polynomial on the pinned
    (Delta^3)^3 compactification; every semialgebraically connected component
    in the open strict row-2599 parent cell; closure at every true parent or
    coordinate-divisor boundary; smooth and singular wall points; all forty
    retained parent-safe source segments; open-edge and endpoint distance
    strata; optional refinement by other residual intersections.
  excluded: >-
    No critical samples were computed for the 17,824 candidate factors; no
    representative-to-skeleton paths, complete wall labels, global regular
    master poset, middle-rank replay, other parent orbit, or 9DVL ledger
    promotion is claimed.
canaries:
  positive: >-
    Compactification barrier B is positive on the strict parent cell and zero
    on its true boundary, so its maximum on the closure of any wall component
    lies in the component and satisfies the displayed rank-minor system.
  negative: >-
    The smooth primitive cylinder x^2+y^2-1=0 avoiding an internal z-axis
    segment has a two-dimensional nearest-point KKT locus, rejecting raw
    zero-dimensionality.
  null: >-
    If the strict-parent wall is empty, the critical locus and its finite
    sample set are empty and the coverage equivalence is vacuous.
  hostile: >-
    At a singular wall point the rank of J(G6,G7,G8,f) drops, forcing every
    displayed 5-by-5 minor to vanish; skeleton endpoints remain t=0 or t=1
    parameter strata and are never tagged as parent infinity.
