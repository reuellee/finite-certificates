outcome: proved
summary: >-
  Proved that a true-parent-boundary barrier yields a semialgebraic critical
  locus meeting every connected component of one primitive full-support
  row-2599 residual wall, so exact component-sampling gives a finite
  representative gate for the 40-edge missed-component obligation; also
  disproved the stronger claim that the unperturbed nearest-point KKT locus
  must itself be zero-dimensional.
