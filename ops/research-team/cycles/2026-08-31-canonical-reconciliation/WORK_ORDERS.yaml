publication_authorization: &publication_authorization |
  The user explicitly authorizes this 9DVL cycle to publish research code and
  artifacts to the public GitHub repository `reuellee/finite-certificates`;
  create and update named research branches and pull requests; push commits;
  run or rerun CI; and merge only after required checks pass at the exact
  independently reviewed head.  The user also authorizes durable recovery
  checkpoints only in the Google Drive `Projects/research-backups` area.  This
  authorization does not permit publishing secrets or private unrelated files,
  modifying any other repository, using paid external compute or paid APIs,
  changing repository visibility or settings, force-pushing, deleting history
  or data, or taking other irreversible actions without separate approval.
  Use the authenticated GitHub connector for GitHub publication operations;
  do not substitute `gh`.

strategy_gate:
  opening_verdict: CONTINUE_CANONICAL_RECONCILIATION_ONLY
  closing_required: true
  stagnation_rule: >-
    Mathematical discovery remains stopped until one canonical state reflects
    all accepted PR #42--#44 facts and an independent exact-head review passes.

work_orders:
  - track_id: canonical-reconciliation-coordinator
    role: coordinator
    base_revision: e666990f5b0cf07fef4a639bbb6596ddc9c4515a
    publication_authorization: *publication_authorization
    target:
      claim: Integrate only independently accepted canonical-state evidence.
      quantifiers: Every changed path, count, status, retirement, and theorem nonconsequence.
      ledger_id: canonical_state_consistency
    deliverables:
      positive: Integrated candidate, cycle report, exact publication identities, and recovery manifest.
      negative: Frozen mismatch report naming the disputed artifact and field.
      null: Field-level unresolved-precedence manifest.
      timeout: Reproducible partial integration manifest.
    verification:
      replay: Run the canonical ledger verifier, cycle protocol verifier, and all PR #42--#44 source verifiers named by the candidate.
      canaries: [unchanged-2-of-9, stale-target-rejected, false-promotion-rejected, prohibited-route-rejected]
    resource_ceiling: One coordinator turn, 30 minutes, 2 GiB RSS, no paid services.
    stop_rule: Stop on mismatch, unresolved authority, accepted frozen candidate, or ceiling.
    prohibited_scope: No mathematical discovery, score change, D4-S53 continuation, or orbit-5563 local continuation.
    worker_restrictions: Coordinator integrates and publishes but does not independently approve its own evidence.

