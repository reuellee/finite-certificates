publication_authorization: &publication_authorization |
  The user explicitly authorizes this 9DVL cycle to publish research code and
  artifacts to the public GitHub repository `reuellee/finite-certificates`;
  create and update named research branches and pull requests; push commits;
  run or rerun CI; and merge only after required checks pass at the exact
  independently reviewed head.  The user also authorizes durable recovery
  checkpoints only in the Google Drive `Projects/research-backups` area.  This
  authorization does not permit publishing secrets or private unrelated files,
  modifying any other repository, using paid external compute or paid APIs,
  changing repository visibility or settings, force-pushing, deleting history
  or data, or taking other irreversible actions without separate approval.
  Use the authenticated GitHub connector for GitHub publication operations;
  do not substitute `gh`.

strategy_gate:
  opening_verdict: CONTINUE_ONE_BOUNDED_DISCRIMINATOR
  closing_required: true
  stagnation_rule: >-
    Stop after one nonvacuity gate and one fixed-fan discriminator. A positive
    local filling retires this route; it cannot justify another mask-6 cycle.

work_orders:
  - track_id: diag8-mask6-opening-scout
    role: coordinator and cross-domain strategy scout
    base_revision: 6c7f52b43632072100b67e5f0a9b6221df14d620
    publication_authorization: *publication_authorization
    target:
      claim: Rank the live D8, D3, and D9 routes and map one outside-field method without importing its theorem.
      quantifiers: All eight protocol strategy dimensions, explicit fatal analogy breaks, and one bounded target or no-go verdict.
      ledger_id: target_selection
    deliverables:
      positive: Ranked strategy table and exact CEGAR-to-certificate mapping.
      negative: Fatal mismatch proving the proposed transfer cannot control this target.
      null: NO_GO_NOW comparison with the missing information named.
      timeout: Partial score table with unchecked dimensions identified.
    verification:
      replay: Recheck all scores against the canonical state and source-pinned literature.
      canaries: [analogy-is-not-proof, no-hidden-score-promotion, no-retired-route]
    resource_ceiling: One agent turn, 20 minutes, ordinary local compute, no paid services.
    stop_rule: Stop at one ranked opening verdict or the ceiling.
    prohibited_scope: No certificate production, theorem change, or repository publication.
    worker_restrictions: Read-only research role; the coordinator alone integrates its result.

