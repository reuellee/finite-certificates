    negative: Complete hostile matrix without a fatal defect.
    null: Smallest unresolved attack and exact deciding experiment.
    timeout: Checked/unchecked hostile matrix.
    resource_ceiling: Shared opening ceiling.
    stop_rule: Stop at first fatal defect, complete audit, or a ceiling.
    prohibited_scope: Do not repair producer arguments or edit their artifacts.
    worker_restrictions: Own only ops/team/d9-universal-cut-falsifier.

