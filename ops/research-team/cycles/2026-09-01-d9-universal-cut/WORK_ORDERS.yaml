work_orders:
  - track_id: d9-universal-cut-prover
    role: constructive prover
    base_revision: cbe84ccd7273252c81fd4da17ee360a284d2a2a6
    publication_authorization: *publication_authorization
    target: Prove a universal reduction from two feasible active-sector components to a finite source-reconstructible minimal-separator schema.
    quantifiers: Every realizable parent, admissible nine-family, active literal, component cut, multiwall, recursive boundary stratum, chart, and genuine infinity mode.
    positive: Deductive coverage theorem with exact hypotheses and finite schema grammar.
    negative: Minimal exact countermodel to the proposed reduction.
    null: First uncovered global-cut mode and the weakest missing lemma.
    timeout: Hash-pinned proved lemmas, failed lemmas, and unresolved obligations.
    resource_ceiling: 12 wall-hours, 64 aggregate CPU-hours shared by opening tracks, 16 GiB, 10000 schema types.
    stop_rule: Stop at a complete reduction, first fatal counterexample, or any opening ceiling.
    prohibited_scope: No sampled coverage, fixed-family promotion, weighted-link continuation, ledger edit, or GitHub write.
    worker_restrictions: Own only ops/team/d9-universal-cut-prover.

  - track_id: d9-universal-cut-circuits
    role: structural combinatorics prover
    base_revision: cbe84ccd7273252c81fd4da17ee360a284d2a2a6
    publication_authorization: *publication_authorization
    target: Decide whether 13 wall types plus support-minimal Gordan circuits and circuit elimination give a finite complete separator obstruction grammar.
    positive: Exact grammar, transport rules, and completeness proof covering singular and simultaneous multiwalls.
    negative: Exact configuration with identical local types but inequivalent global cut behavior.
    null: Complete surviving grammar extensions and first unclassified circuit composition.
    timeout: Deterministic type/instance frontier.
    resource_ceiling: Shared opening ceiling; at most 10000 types and 250000 exact instances.
    stop_rule: Stop at completeness, first non-finite/global-memory obstruction, or a ceiling.
    prohibited_scope: No inference from local coorientation alone and no theorem promotion.
    worker_restrictions: Own only ops/team/d9-universal-cut-circuits.

  - track_id: d9-universal-cut-boundary
    role: semialgebraic boundary and transport prover
    base_revision: cbe84ccd7273252c81fd4da17ee360a284d2a2a6
    publication_authorization: *publication_authorization
    target: Prove or refute that schema witnesses preserve strict parent residence, charts, multiplicity, recursive facets, multiwall incidence, and genuine infinity.
    positive: Exact boundary/transport lemma sufficient for the universal cut reduction.
    negative: Minimal omitted end or transport mode.
    null: Exact boundary registry plus first unresolved attachment.
    timeout: Checked/unchecked boundary and transport frontier.
    resource_ceiling: Shared opening ceiling.
    stop_rule: Stop at a complete lemma, first fatal omitted mode, or a ceiling.
    prohibited_scope: A recursive-facet wall is not a strict-open-parent or global separator.
    worker_restrictions: Own only ops/team/d9-universal-cut-boundary.

  - track_id: d9-universal-cut-falsifier
    role: independent falsifier
    base_revision: cbe84ccd7273252c81fd4da17ee360a284d2a2a6
    publication_authorization: *publication_authorization
    target: Break the universal cut reduction using abstract polynomial countermodels, multiwall memory, missing infinity, occurrence orientation, or feasible-component labeling.
